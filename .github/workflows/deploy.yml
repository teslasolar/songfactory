name: Deploy Song Factory Dashboard

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into config
        run: |
          sed -i "s|%%YOUTUBE_API_KEY%%|${YOUTUBE_API_KEY}|g" js/config.js
          sed -i "s|%%YOUTUBE_CHANNEL_ID%%|${YOUTUBE_CHANNEL_ID}|g" js/config.js
          sed -i "s|%%GOOGLE_CLIENT_ID%%|${GOOGLE_CLIENT_ID}|g" js/config.js
          sed -i "s|%%SPOTIFY_CLIENT_ID%%|${SPOTIFY_CLIENT_ID}|g" js/config.js
          sed -i "s|%%SPOTIFY_CLIENT_SECRET%%|${SPOTIFY_CLIENT_SECRET}|g" js/config.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
